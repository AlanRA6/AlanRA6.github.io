<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Planes y Materias - CRUD</title>
<style>
    /* === ESTILOS  === */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: radial-gradient(circle at 20% 20%, #2b1055, #7597de);
        min-height: 100vh;
        color: #e3e3e3;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px;
        overflow-x: hidden;
    }

    /* === CONTAINER === */
    .container {
        max-width: 1200px;
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        padding: 30px;
        animation: fadeSlideIn 0.8s ease forwards;
    }

    @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        text-align: center;
        font-size: 2.2rem;
        color: #ffffff;
        text-shadow: 0 0 10px #00e1ff;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    /* === TABS === */
    .tabs {
        display: flex;
        justify-content: center;
        border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        margin-bottom: 25px;
        gap: 10px;
    }

    .tab-button {
        padding: 12px 24px;
        border: none;
        cursor: pointer;
        font-size: 15px;
        font-weight: 500;
        color: #cfd9df;
        background: transparent;
        border-radius: 8px;
        transition: all 0.3s ease;
        position: relative;
    }

    .tab-button:hover {
        color: #00e1ff;
        transform: scale(1.05);
    }

    .tab-button.active {
        color: #fff;
        background: linear-gradient(135deg, #00e1ff, #8e2de2);
        box-shadow: 0 0 15px rgba(0, 225, 255, 0.4);
    }

    /* === TAB CONTENT === */
    .tab-content {
        display: none;
        animation: fadeIn 0.4s ease;
    }

    .tab-content.active {
        display: block;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* === TABLE === */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        overflow: hidden;
        border-radius: 10px;
    }

    th, td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    th {
        background: linear-gradient(135deg, #8e2de2, #00e1ff);
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
    }

    tr:hover {
        background-color: rgba(255,255,255,0.05);
        transition: 0.3s ease;
    }

    /* === BUTTONS === */
    .btn {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #fff;
        font-weight: 500;
        letter-spacing: 0.5px;
        position: relative;
        overflow: hidden;
        z-index: 1;
    }

    .btn::after {
        content: "";
        position: absolute;
        top: 0; left: -100%;
        width: 100%; height: 100%;
        background: rgba(255,255,255,0.2);
        transition: left 0.4s;
        z-index: 0;
    }

    .btn:hover::after {
        left: 0;
    }

    .btn-primary { background: linear-gradient(135deg, #00e1ff, #0077ff); }
    .btn-success { background: linear-gradient(135deg, #00b09b, #96c93d); }
    .btn-warning { background: linear-gradient(135deg, #ffb347, #ffcc33); color: #222; }
    .btn-danger  { background: linear-gradient(135deg, #f85032, #e73827); }

    /* === FORM === */
    .form-container {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 25px;
        backdrop-filter: blur(8px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        transition: transform 0.3s;
    }

    .form-container:hover {
        transform: scale(1.01);
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        font-weight: 500;
        margin-bottom: 6px;
        color: #cfd9df;
        display: block;
    }

    input[type="text"],
    input[type="number"] {
        width: 100%;
        padding: 10px;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        background-color: rgba(255,255,255,0.05);
        color: #fff;
        font-size: 15px;
        transition: all 0.3s ease;
    }

    input:focus {
        border-color: #00e1ff;
        outline: none;
        box-shadow: 0 0 8px #00e1ff;
    }

    /* === PAGINATION === */
    .pagination {
        display: flex;
        justify-content: center;
        margin-top: 25px;
        gap: 8px;
    }

    .pagination button {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: rgba(255,255,255,0.1);
        color: #fff;
        cursor: pointer;
        transition: all 0.3s;
    }

    .pagination button:hover {
        background: rgba(0, 225, 255, 0.3);
        transform: translateY(-2px);
    }

    .pagination button.active {
        background: linear-gradient(135deg, #00e1ff, #8e2de2);
    }

    .pagination button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    /* === SEARCH === */
    .search-container {
        margin-bottom: 20px;
        text-align: center;
    }

    .search-container input {
        width: 320px;
        padding: 10px 15px;
        border-radius: 6px;
        border: none;
        background-color: rgba(255,255,255,0.1);
        color: #fff;
        transition: 0.3s;
    }

    .search-container input:focus {
        box-shadow: 0 0 10px #00e1ff;
        outline: none;
    }

    /* === STATUS MESSAGES === */
    .loading, .error, .success {
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        margin-top: 15px;
        font-weight: 500;
        animation: fadeIn 0.4s ease;
    }

    .loading { color: #ccc; }
    .error { background: rgba(255, 0, 0, 0.1); color: #ff6b6b; border: 1px solid #ff4c4c; }
    .success { background: rgba(0, 255, 128, 0.1); color: #00ff99; border: 1px solid #00ff99; }
</style>

</head>
<body>
    <div class="container">
        <h1>Gestión de Planes y Materias</h1>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('list', event)">Listar Materias</button>
            <button class="tab-button" onclick="showTab('search', event)">Buscar Materia</button>
            <button class="tab-button" onclick="showTab('create', event)">Crear Materia</button>
            <button class="tab-button" onclick="showTab('update', event)">Actualizar Materia</button>
            <button class="tab-button" onclick="showTab('delete', event)">Eliminar Materia</button>
        </div>

        <!-- Tab de Listar -->
        <div id="list-tab" class="tab-content active">
            <h2>Lista de Materias</h2>
            <div id="loading-list" class="loading">Cargando materias...</div>
            <div id="error-list" class="error" style="display:none;"></div>
            <table id="materias-table" style="display:none;">
                <thead>
                    <tr>
                        <th>Clave Plan</th>
                        <th>Grado</th>
                        <th>Clave</th>
                        <th>Materia</th>
                        <th>Horas Prác.</th>
                        <th>Horas Teo.</th>
                        <th>Créditos</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="materias-tbody">
                </tbody>
            </table>
            <div id="pagination" class="pagination"></div>
        </div>

        <!-- Tab de Buscar -->
        <div id="search-tab" class="tab-content">
            <h2>Buscar Materia</h2>
            <div class="form-container">
                <div class="form-group">
                    <label for="search-cve-plan">Clave del Plan:</label>
                    <input type="number" id="search-cve-plan" placeholder="Ej: 666">
                </div>
                <div class="form-group">
                    <label for="search-clave">Clave de la Materia:</label>
                    <input type="number" id="search-clave" placeholder="Ej: 666666">
                </div>
                <button class="btn btn-primary" onclick="searchMateria()">Buscar</button>
                <div id="search-result" style="margin-top: 20px;"></div>
            </div>
        </div>

        <!-- Tab de Crear -->
        <div id="create-tab" class="tab-content">
            <h2>Crear Nueva Materia</h2>
            <div class="form-container">
                <form id="create-form" onsubmit="createMateria(event)">
                    <div class="form-group">
                        <label for="create-cve-plan">Clave del Plan:</label>
                        <input type="number" id="create-cve-plan" name="cve_plan" required>
                    </div>
                    <div class="form-group">
                        <label for="create-grado">Grado:</label>
                        <input type="text" id="create-grado" name="grado" required>
                    </div>
                    <div class="form-group">
                        <label for="create-clave">Clave de la Materia:</label>
                        <input type="number" id="create-clave" name="clave" required>
                    </div>
                    <div class="form-group">
                        <label for="create-materia">Nombre de la Materia:</label>
                        <input type="text" id="create-materia" name="materia" required>
                    </div>
                    <div class="form-group">
                        <label for="create-horas-prac">Horas Prácticas:</label>
                        <input type="text" id="create-horas-prac" name="horas_prac" required>
                    </div>
                    <div class="form-group">
                        <label for="create-horas-teo">Horas Teóricas:</label>
                        <input type="text" id="create-horas-teo" name="horas_teo" required>
                    </div>
                    <div class="form-group">
                        <label for="create-creditos">Créditos:</label>
                        <input type="text" id="create-creditos" name="creditos" required>
                    </div>
                    <button type="submit" class="btn btn-success">Crear Materia</button>
                </form>
                <div id="create-result" style="margin-top: 20px;"></div>
            </div>
        </div>

        <!-- Tab de Actualizar -->
        <div id="update-tab" class="tab-content">
            <h2>Actualizar Materia</h2>
            <div class="form-container">
                <form id="update-form" onsubmit="updateMateria(event)">
                    <div class="form-group">
                        <label for="update-cve-plan">Clave del Plan:</label>
                        <input type="number" id="update-cve-plan" name="cve_plan" required>
                    </div>
                    <div class="form-group">
                        <label for="update-grado">Grado:</label>
                        <input type="text" id="update-grado" name="grado" required>
                    </div>
                    <div class="form-group">
                        <label for="update-clave">Clave de la Materia:</label>
                        <input type="number" id="update-clave" name="clave" required>
                    </div>
                    <div class="form-group">
                        <label for="update-materia">Nombre de la Materia:</label>
                        <input type="text" id="update-materia" name="materia" required>
                    </div>
                    <div class="form-group">
                        <label for="update-horas-prac">Horas Prácticas:</label>
                        <input type="text" id="update-horas-prac" name="horas_prac" required>
                    </div>
                    <div class="form-group">
                        <label for="update-horas-teo">Horas Teóricas:</label>
                        <input type="text" id="update-horas-teo" name="horas_teo" required>
                    </div>
                    <div class="form-group">
                        <label for="update-creditos">Créditos:</label>
                        <input type="text" id="update-creditos" name="creditos" required>
                    </div>
                    <button type="submit" class="btn btn-warning">Actualizar Materia</button>
                </form>
                <div id="update-result" style="margin-top: 20px;"></div>
            </div>
        </div>

        <!-- Tab de Eliminar -->
        <div id="delete-tab" class="tab-content">
            <h2>Eliminar Materia</h2>
            <div class="form-container">
                <div class="form-group">
                    <label for="delete-cve-plan">Clave del Plan:</label>
                    <input type="number" id="delete-cve-plan" placeholder="Ej: 666">
                </div>
                <div class="form-group">
                    <label for="delete-clave">Clave de la Materia:</label>
                    <input type="number" id="delete-clave" placeholder="Ej: 666666">
                </div>
                <button class="btn btn-danger" onclick="deleteMateria()">Eliminar</button>
                <div id="delete-result" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <script>
        // Variables globales
        let allMaterias = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        // Función para mostrar tabs
        function showTab(tabName, event) {
            // Ocultar todos los tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Quitar clase active de todos los botones
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Mostrar el tab seleccionado
            document.getElementById(`${tabName}-tab`).classList.add('active');
            
            // Activar el botón correspondiente
            if (event && event.target) {
                event.target.classList.add('active');
            }
            
            // Si es el tab de listar, cargar las materias
            if (tabName === 'list') {
                loadMaterias();
            }
        }

        // Función para cargar todas las materias
        async function loadMaterias() {
            const loadingDiv = document.getElementById('loading-list');
            const errorDiv = document.getElementById('error-list');
            const table = document.getElementById('materias-table');
            
            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            table.style.display = 'none';
            
            try {
                const response = await fetch('https://pycsoftwaremx.com/david/rest_api_alu_materias_daw/api/lista_planes_materias.php');
                const data = await response.json();
                
                allMaterias = data.body || [];
                displayMaterias();
                
                loadingDiv.style.display = 'none';
                table.style.display = 'table';
            } catch (error) {
                loadingDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Error al cargar las materias: ' + error.message;
            }
        }

        // Función para mostrar materias con paginación
        function displayMaterias() {
            const tbody = document.getElementById('materias-tbody');
            const paginationDiv = document.getElementById('pagination');
            
            // Calcular índices
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const materiasToShow = allMaterias.slice(startIndex, endIndex);
            
            // Limpiar tabla
            tbody.innerHTML = '';
            
            // Llenar tabla
            materiasToShow.forEach(materia => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${materia.cve_plan || ''}</td>
                    <td>${materia.grado || ''}</td>
                    <td>${materia.clave || ''}</td>
                    <td>${materia.materia || ''}</td>
                    <td>${materia.horas_prac || ''}</td>
                    <td>${materia.horas_teo || ''}</td>
                    <td>${materia.creditos || ''}</td>
                    <td>
                        <button class="btn btn-warning" onclick="fillUpdateForm(${JSON.stringify(materia).replace(/"/g, '&quot;')})">Editar</button>
                        <button class="btn btn-danger" onclick="fillDeleteForm(${materia.cve_plan}, ${materia.clave})">Eliminar</button>
                    </td>
                `;
            });
            
            // Crear paginación
            const totalPages = Math.ceil(allMaterias.length / itemsPerPage);
            paginationDiv.innerHTML = '';
            
            // Botón anterior
            const prevBtn = document.createElement('button');
            prevBtn.textContent = 'Anterior';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    displayMaterias();
                }
            };
            paginationDiv.appendChild(prevBtn);
            
            // Números de página (limitados a 10 para no saturar)
            let startPage = Math.max(1, currentPage - 4);
            let endPage = Math.min(totalPages, startPage + 9);
            
            if (endPage - startPage < 9) {
                startPage = Math.max(1, endPage - 9);
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;
                pageBtn.classList.toggle('active', i === currentPage);
                pageBtn.onclick = () => {
                    currentPage = i;
                    displayMaterias();
                };
                paginationDiv.appendChild(pageBtn);
            }
            
            // Botón siguiente
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Siguiente';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    displayMaterias();
                }
            };
            paginationDiv.appendChild(nextBtn);
        }

        // Función para buscar una materia
        async function searchMateria() {
            const cvePlan = document.getElementById('search-cve-plan').value;
            const clave = document.getElementById('search-clave').value;
            const resultDiv = document.getElementById('search-result');
            
            if (!cvePlan || !clave) {
                resultDiv.innerHTML = '<div class="error">Por favor, ingrese ambos valores</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="loading">Buscando...</div>';
            
            try {
                const response = await fetch(`https://pycsoftwaremx.com/david/rest_api_alu_materias_daw/api/busca_plan_materia.php?cve_plan=${cvePlan}&clave=${clave}`);
                const data = await response.json();
                
                if (data && data.cve_plan !== undefined) {
                    resultDiv.innerHTML = `
                        <div class="success">Materia encontrada:</div>
                        <table style="margin-top: 10px;">
                            <tr><td><strong>Clave Plan:</strong></td><td>${data.cve_plan || ''}</td></tr>
                            <tr><td><strong>Grado:</strong></td><td>${data.grado || ''}</td></tr>
                            <tr><td><strong>Clave:</strong></td><td>${data.clave || ''}</td></tr>
                            <tr><td><strong>Materia:</strong></td><td>${data.materia || ''}</td></tr>
                            <tr><td><strong>Horas Prácticas:</strong></td><td>${data.horas_prac || ''}</td></tr>
                            <tr><td><strong>Horas Teóricas:</strong></td><td>${data.horas_teo || ''}</td></tr>
                            <tr><td><strong>Créditos:</strong></td><td>${data.creditos || ''}</td></tr>
                        </table>
                    `;
                } else {
                    resultDiv.innerHTML = '<div class="error">Materia no encontrada</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error al buscar: ${error.message}</div>`;
            }
        }

        // Función mejorada para crear materia
        async function createMateria(event) {
            event.preventDefault();
            
            const resultDiv = document.getElementById('create-result');
            
            // Crear FormData desde el formulario
            const formElement = document.getElementById('create-form');
            const formData = new FormData(formElement);
            
            resultDiv.innerHTML = '<div class="loading">Creando materia...</div>';
            
            try {
                // Intentar primero con JSON
                const jsonData = {
                    cve_plan: formData.get('cve_plan'),
                    grado: formData.get('grado'),
                    clave: formData.get('clave'),
                    materia: formData.get('materia'),
                    horas_prac: formData.get('horas_prac'),
                    horas_teo: formData.get('horas_teo'),
                    creditos: formData.get('creditos')
                };
                
                let response = await fetch('https://pycsoftwaremx.com/david/rest_api_alu_materias_daw/api/create_materia.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(jsonData)
                });
                
                // Si falla con JSON, intentar con FormData
                if (!response.ok) {
                    response = await fetch('https://pycsoftwaremx.com/david/rest_api_alu_materias_daw/api/create_materia.php', {
                        method: 'POST',
                        body: formData
                    });
                }
                
                // Intentar parsear como JSON
                let data;
                const responseText = await response.text();
                
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    // Si no es JSON, usar el texto directamente
                    data = { message: responseText };
                }
                
                if (response.ok || responseText.includes('Satisfactoriamente') || responseText.includes('exitosamente')) {
                    resultDiv.innerHTML = '<div class="success">Materia creada exitosamente</div>';
                    formElement.reset();
                    // Recargar la lista después de 2 segundos
                    setTimeout(() => loadMaterias(), 2000);
                } else {
                    resultDiv.innerHTML = `<div class="error">Error: ${data.message || responseText}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error al crear: ${error.message}</div>`;
            }
        }

        // Función mejorada para actualizar materia
        async function updateMateria(event) {
            event.preventDefault();
            
            const resultDiv = document.getElementById('update-result');
            
            // Crear FormData desde el formulario
            const formElement = document.getElementById('update-form');
            const formData = new FormData(formElement);
            
            resultDiv.innerHTML = '<div class="loading">Actualizando materia...</div>';
            
            try {
                // Intentar primero con JSON
                const jsonData = {
                    cve_plan: formData.get('cve_plan'),
                    grado: formData.get('grado'),
                    clave: formData.get('clave'),
                    materia: formData.get('materia'),
                    horas_prac: formData.get('horas_prac'),
                    horas_teo: formData.get('horas_teo'),
                    creditos: formData.get('creditos')
                };
                
                let response = await fetch('https://pycsoftwaremx.com/david/rest_api_alu_materias_daw/api/update_materia.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(jsonData)
                });
                
                // Si falla con JSON, intentar con FormData
                if (!response.ok) {
                    response = await fetch('https://pycsoftwaremx.com/david/rest_api_alu_materias_daw/api/update_materia.php', {
                        method: 'POST',
                        body: formData
                    });
                }
                
                // Intentar parsear como JSON
                let data;
                const responseText = await response.text();
                
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    // Si no es JSON, usar el texto directamente
                    data = { message: responseText };
                }
                
                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success">Materia actualizada exitosamente</div>';
                    // Recargar la lista después de 2 segundos
                    setTimeout(() => loadMaterias(), 2000);
                } else {
                    resultDiv.innerHTML = `<div class="error">Error: ${data.message || responseText}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error al actualizar: ${error.message}</div>`;
            }
        }

        // Función mejorada para eliminar materia
        async function deleteMateria() {
            const cvePlan = document.getElementById('delete-cve-plan').value;
            const clave = document.getElementById('delete-clave').value;
            const resultDiv = document.getElementById('delete-result');
            
            if (!cvePlan || !clave) {
                resultDiv.innerHTML = '<div class="error">Por favor, ingrese ambos valores</div>';
                return;
            }
            
            if (!confirm('¿Está seguro de que desea eliminar esta materia?')) {
                return;
            }
            
            resultDiv.innerHTML = '<div class="loading">Eliminando materia...</div>';
            
            try {
                // Intentar con diferentes formatos
                const jsonData = {
                    cve_plan: cvePlan,
                    clave: clave
                };
                
                // Primero intentar con DELETE y JSON
                let response = await fetch('https://pycsoftwaremx.com/david/rest_api_alu_materias_daw/api/delete_materia.php', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(jsonData)
                });
                
                // Si falla, intentar con POST y JSON
                if (!response.ok) {
                    response = await fetch('https://pycsoftwaremx.com/david/rest_api_alu_materias_daw/api/delete_materia.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(jsonData)
                    });
                }
                
                // Si falla, intentar con POST y FormData
                if (!response.ok) {
                    const formData = new FormData();
                    formData.append('cve_plan', cvePlan);
                    formData.append('clave', clave);
                    
                    response = await fetch('https://pycsoftwaremx.com/david/rest_api_alu_materias_daw/api/delete_materia.php', {
                        method: 'POST',
                        body: formData
                    });
                }
                
                // Intentar parsear la respuesta
                let data;
                const responseText = await response.text();
                
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    // Si no es JSON, usar el texto directamente
                    data = { message: responseText };
                }
                
                if (response.ok || responseText.includes('Eliminada') || responseText.includes('exitosamente')) {
                    resultDiv.innerHTML = '<div class="success">Materia eliminada exitosamente</div>';
                    document.getElementById('delete-cve-plan').value = '';
                    document.getElementById('delete-clave').value = '';
                    // Recargar la lista después de 2 segundos
                    setTimeout(() => loadMaterias(), 2000);
                } else {
                    resultDiv.innerHTML = `<div class="error">Error: ${data.message || responseText}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error al eliminar: ${error.message}</div>`;
                console.error('Error completo:', error);
            }
        }

        // Función para llenar el formulario de actualización
        function fillUpdateForm(materia) {
            // Cambiar a la pestaña de actualizar
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById('update-tab').classList.add('active');
            document.querySelectorAll('.tab-button')[3].classList.add('active');
            
            // Llenar el formulario
            document.getElementById('update-cve-plan').value = materia.cve_plan || '';
            document.getElementById('update-grado').value = materia.grado || '';
            document.getElementById('update-clave').value = materia.clave || '';
            document.getElementById('update-materia').value = materia.materia || '';
            document.getElementById('update-horas-prac').value = materia.horas_prac || '';
            document.getElementById('update-horas-teo').value = materia.horas_teo || '';
            document.getElementById('update-creditos').value = materia.creditos || '';
        }

        // Función para llenar el formulario de eliminación
        function fillDeleteForm(cvePlan, clave) {
            // Cambiar a la pestaña de eliminar
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById('delete-tab').classList.add('active');
            document.querySelectorAll('.tab-button')[4].classList.add('active');
            
            // Llenar el formulario
            document.getElementById('delete-cve-plan').value = cvePlan || '';
            document.getElementById('delete-clave').value = clave || '';
        }

        // Cargar materias al iniciar
        window.onload = function() {
            loadMaterias();
        };
    </script>
